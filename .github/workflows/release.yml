# Push a tag such as v1.2 to build the APK and publish it as a GitHub release.
#   git tag v1.2
#   git push origin v1.2
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "MoneyTrail-${GITHUB_REF_NAME}.apk"
          sha256sum "MoneyTrail-${GITHUB_REF_NAME}.apk" > "MoneyTrail-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MoneyTrail ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            MoneyTrail-${{ github.ref_name }}.apk
            MoneyTrail-${{ github.ref_name }}.apk.sha256
